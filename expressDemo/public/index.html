<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSNKing Support Chat</title>
    <style>
      :root {
        --bg: #f3f1ee;
        --panel: #ffffff;
        --primary: #111111;
        --primary-soft: #2d2d2d;
        --accent: #d4a373;
        --accent-soft: #f7efe7;
        --user-bubble: #111111;
        --bot-bubble: #f5f5f5;
        --text: #1b1b1b;
        --muted: #666666;
        --border: #e8e3de;
        --error: #b42318;
        --success: #0f766e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f3f1ee 0%, #f8f4f1 100%);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat-shell {
        width: 100%;
        max-width: 900px;
        height: min(90vh, 820px);
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 20px 45px rgba(17, 17, 17, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        background: var(--primary);
        color: white;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand-name {
        font-size: clamp(1.5rem, 2vw, 2rem);
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .brand-sub {
        font-size: 0.74rem;
        opacity: 0.8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .clear-btn {
        border: 1px solid rgba(255,255,255,0.25);
        background: transparent;
        color: white;
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px 14px;
        background: #faf7f4;
      }

      .message-row {
        display: flex;
        margin-bottom: 18px;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.ai {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 75%;
        border-radius: 18px;
        padding: 14px 16px;
        line-height: 1.5;
        font-size: 0.98rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message-row.user .bubble {
        background: var(--user-bubble);
        color: white;
        border-bottom-right-radius: 6px;
      }

      .message-row.ai .bubble {
        background: var(--bot-bubble);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
      }

      .typing {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
      }

      .typing span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8a8a8a;
        animation: bounce 1.2s infinite ease-in-out;
      }

      .typing span:nth-child(2) { animation-delay: 0.15s; }
      .typing span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-4px); opacity: 1; }
      }

      .composer {
        padding: 18px 20px 22px;
        background: white;
        border-top: 1px solid var(--border);
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f7f4f2;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 8px 8px 8px 16px;
      }

      .input-row input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 1rem;
        color: var(--text);
      }

      .send-btn {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @media (max-width: 640px) {
        .chat-shell {
          height: 100vh;
          border-radius: 0;
          max-width: 100%;
        }

        .header {
          padding: 16px 18px;
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="chat-shell">
        <div class="header">
          <div class="brand">
            <div class="brand-name">BSNKing</div>
            <div class="brand-sub">Customer Support</div>
          </div>
          <button class="clear-btn" id="clearChatBtn" type="button">Clear chat</button>
        </div>

        <div class="chat-area" id="chatArea" aria-live="polite"></div>

        <div class="composer">
          <div class="input-row">
            <input
              id="userInput"
              type="text"
              placeholder="Type your message..."
              autocomplete="off"
            />
            <button id="sendBtn" class="send-btn" type="button">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const chatArea = document.getElementById('chatArea');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');
      let isLoading = false;

      function addMessage(role, text) {
        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        row.appendChild(bubble);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function showTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'message-row ai';

        const bubble = document.createElement('div');
        bubble.className = 'bubble typing';
        bubble.innerHTML = '<span></span><span></span><span></span>';

        row.appendChild(bubble);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
        return row;
      }

      function removeTypingIndicator(row) {
        if (row && row.parentNode) {
          row.parentNode.removeChild(row);
        }
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message || isLoading) return;

        isLoading = true;
        sendBtn.disabled = true;
        userInput.value = '';

        addMessage('user', message);
        const typingRow = showTypingIndicator();

        try {
          const response = await fetch("api/chat", {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain',
            },
            body: message,
          });

          if (!response.ok) {
            throw new Error(`Backend error: ${response.status}`);
          }

          const text = await response.text();
          removeTypingIndicator(typingRow);
          addMessage('ai', text || 'I am sorry, I could not generate a response right now.');
        } catch (error) {
          removeTypingIndicator(typingRow);
          addMessage('ai', 'Sorry, I could not reach the BSNKing support server. Please try again in a moment.');
          console.error(error);
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });

      clearChatBtn.addEventListener('click', () => {
        chatArea.innerHTML = '';
        fetch('http://localhost:3000/api', { method: 'DELETE' }).catch(() => {});
      });

      addMessage('ai', 'Hi! How can I help with your BSNKing order today?');
    </script>
  </body>
</html>
